<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fondo con esquinas redondeadas (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Patrón sutil de fondo -->
  <circle cx="256" cy="256" r="190" fill="white" opacity="0.06"/>
  <circle cx="256" cy="256" r="130" fill="white" opacity="0.08"/>
  
  <!-- Carrito de compras + Balanza -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Carrito de compras blanco -->
    <path d="M70 120 h45 l40 160 h195 l35 -125 h-250" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ruedas del carrito -->
    <circle cx="175" cy="340" r="24" fill="#ffffff"/>
    <circle cx="330" cy="340" r="24" fill="#ffffff"/>

    <!-- Balanza dorada central de comparación -->
    <!-- Columna balanza -->
    <line x1="250" y1="130" x2="250" y2="230" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Brazo oscilante balanza -->
    <line x1="180" y1="160" x2="320" y2="150" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Platillo izquierdo -->
    <path d="M150 195 h60 l-30 25 z" fill="url(#goldGrad)"/>
    <line x1="180" y1="160" x2="150" y2="195" stroke="url(#goldGrad)" stroke-width="6"/>
    <line x1="180" y1="160" x2="210" y2="195" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Platillo derecho -->
    <path d="M290 185 h60 l-30 25 z" fill="url(#goldGrad)"/>
    <line x1="320" y1="150" x2="290" y2="185" stroke="url(#goldGrad)" stroke-width="6"/>
    <line x1="320" y1="150" x2="350" y2="185" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Estrella / Destello de ahorro -->
    <path d="M370 70 L382 100 L412 112 L382 124 L370 154 L358 124 L328 112 L358 100 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
